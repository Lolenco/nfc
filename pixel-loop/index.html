function exposedCells(grid,N){
  const out=new Set();
  for(let r=0;r<N;r++){
    for(let c=0;c<N;c++) if(grid[r][c]>=0){out.add(r*N+c);break;}
    for(let c=N-1;c>=0;c--) if(grid[r][c]>=0){out.add(r*N+c);break;}
  }
  for(let c=0;c<N;c++){
    for(let r=0;r<N;r++) if(grid[r][c]>=0){out.add(r*N+c);break;}
    for(let r=N-1;r>=0;r--) if(grid[r][c]>=0){out.add(r*N+c);break;}
  }
  return out;

function simulateLap(grid,N,color,ammo){

    if(!opts.length) return false;
    let best=null,bh=-1;
    for(const o of opts){const g=grid.map(r=>r.slice()); const res=simulateLap(g,L.N,o.s.color,o.s.ammo); const sc=res.hits+(res.ammo===0?100:0); if(sc>bh){bh=sc;best=o;}}
    if(best.src==='c') cols[best.i].shift(); else hold.splice(best.i,1);
    const res=simulateLap(grid,L.N,best.s.color,best.s.ammo); total-=res.hits;
    if(res.ammo>0){ hold.push({color:best.s.color,ammo:res.ammo}); if(hold.length>5) return false; }
  }
  return total===0;
}
function makeLevel(level){ let L; for(let a=0;a<40;a++){ L=generateLevel(level,a); if(greedySolve(L)) return L; } return L; }


// ===== Jeu =====
const W=400,H=740,BT=40,OFF=26,SPEED=210,SZ=32,HOLD=5,BELT_MAX=5;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let scale=1,dpr=1;
function resize(){
  const top=document.getElementById('bar').offsetHeight;
  scale=Math.min(window.innerWidth/W,(window.innerHeight-top-8)/H);
  dpr=window.devicePixelRatio||1;
  cv.style.width=W*scale+'px'; cv.style.height=H*scale+'px';
  cv.width=Math.round(W*scale*dpr); cv.height=Math.round(H*scale*dpr);
}
window.addEventListener('resize',resize);

let level=1; try{ level=parseInt(localStorage.getItem('pixelloop_level'))||1; }catch(e){}
let L,N,G,cs,gx,gy,LP,SEG,grid,colors,columns,hold,belt,pending,bullets,particles,remaining,state,flash=0,beltT=0,endTimer=0;

function start(lv){
  level=lv; try{localStorage.setItem('pixelloop_level',level);}catch(e){}
  L=makeLevel(level); N=L.N; colors=L.colors;
  G=288; cs=G/N; gx=(W-G)/2; gy=10+BT+6;
  SEG=G+Math.PI/2*OFF; LP=4*SEG;
  grid=L.grid.map(r=>r.slice());
  columns=L.columns.map(c=>c.map(s=>({...s})));
  hold=Array(HOLD).fill(null); belt=[]; pending=[]; bullets=[]; particles=[];
  remaining=grid.flat().filter(v=>v>=0).length; state='play'; endTimer=0;
  document.getElementById('lvl').textContent='Niveau '+level;
  document.getElementById('ov').style.display='none';
}

function posAt(s){
  const k=Math.min(3,Math.floor(s/SEG)), u=s-k*SEG;
  if(u<G){
    if(k===0) return {x:gx-OFF,y:gy+G-u};
    if(k===1) return {x:gx+u,y:gy-OFF};
    if(k===2) return {x:gx+G+OFF,y:gy+u};
    return {x:gx+G-u,y:gy+G+OFF};
  }
  const f=(u-G)/OFF, C=[[gx,gy,Math.PI],[gx+G,gy,-Math.PI/2],[gx+G,gy+G,0],[gx,gy+G,Math.PI/2]][k];
  return {x:C[0]+OFF*Math.cos(C[2]+f),y:C[1]+OFF*Math.sin(C[2]+f)};
}
function lineCells(k,i){
  const a=[];
  for(let j=0;j<N;j++){
    if(k===0) a.push([N-1-i,j]); else if(k===1) a.push([j,i]);
    else if(k===2) a.push([i,N-1-j]); else a.push([N-1-j,N-1-i]);
  }
  return a;
}
function fire(sh,k,i){
  for(const [r,c] of lineCells(k,i)){
    const v=grid[r][c];
    if(v>=0){
      if(v===sh.color&&sh.ammo>0){
        grid[r][c]=-2-v; sh.ammo--; remaining--;
        const p=posAt(sh.s), tx=gx+(c+.5)*cs, ty=gy+(r+.5)*cs;
        bullets.push({x0:p.x,y0:p.y,x1:tx,y1:ty,t:0,dur:Math.max(.05,Math.hypot(tx-p.x,ty-p.y)/1300),r,c,v});
        sound();
      }
      return;
    }
  }
}
function launch(sh){
  if(state!=='play') return false;
  if(belt.length+pending.length>=BELT_MAX){flash=.5;return false;}
  pending.push({color:sh.color,ammo:sh.ammo,s:0,bump:0}); return true;
}

function update(dt){
  beltT+=dt; flash=Math.max(0,flash-dt);
  if(state==='play'&&pending.length&&belt.every(b=>b.s>SZ+6)) belt.push(pending.shift());
  for(const b of belt){
    const s0=b.s, s1=s0+SPEED*dt; b.s=s1; b.bump=Math.max(0,b.bump-dt*4);
    for(let k=0;k<4;k++)for(let i=0;i<N;i++){
      const sc=k*SEG+(i+.5)*cs;
      if(sc>s0&&sc<=s1&&b.ammo>0){const a=b.ammo; fire(b,k,i); if(b.ammo<a) b.bump=1;}
    }
  }
  for(let j=belt.length-1;j>=0;j--){
    const b=belt[j];
    if(b.ammo===0){ const p=posAt(b.s); burst(p.x,p.y,colors[b.color],14,SZ/2); belt.splice(j,1); continue; }
    if(b.s>=LP){
      belt.splice(j,1);
      const slot=hold.indexOf(null);
      if(slot<0){ if(state==='play'){state='lose';endTimer=.6;} }
      else hold[slot]={color:b.color,ammo:b.ammo};
    }
  }
  for(let j=bullets.length-1;j>=0;j--){
    const u=bullets[j]; u.t+=dt;
    if(u.t>=u.dur){ grid[u.r][u.c]=-1; burst(gx+(u.c+.5)*cs,gy+(u.r+.5)*cs,colors[u.v],4,cs); bullets.splice(j,1); }
  }
  for(let j=particles.length-1;j>=0;j--){const p=particles[j];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;if(p.t<=0)particles.splice(j,1);}
  if(state==='play'&&remaining===0&&!bullets.length){state='win';endTimer=.7;}
  if(endTimer>0){endTimer-=dt;if(endTimer<=0)showEnd();}
}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=40+Math.random()*sp*6;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,t:.35+Math.random()*.3,col,s:2+Math.random()*3});}}

// ----- Dessin -----
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return `rgb(${r},${g},${b})`;}
function drawShooter(x,y,size,ci,ammo,alpha=1,bump=0){
  const col=colors[ci], s=size*(1+bump*.12);
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,.25)'; rr(-s*.45,-s*.38,s*.9,s*.9,s*.32); ctx.fill();
  const g=ctx.createLinearGradient(0,-s/2,0,s/2); g.addColorStop(0,shade(col,.25)); g.addColorStop(1,shade(col,-.25));
  ctx.fillStyle=g; rr(-s*.45,-s*.46,s*.9,s*.86,s*.32); ctx.fill();
  ctx.strokeStyle=shade(col,-.45); ctx.lineWidth=Math.max(1.5,s*.05); ctx.stroke();
  // petites oreilles
  ctx.fillStyle=shade(col,-.1);
  ctx.beginPath(); ctx.arc(-s*.28,-s*.44,s*.11,0,7); ctx.arc(s*.28,-s*.44,s*.11,0,7); ctx.fill();
  // yeux
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-s*.16,-s*.18,s*.09,0,7); ctx.arc(s*.16,-s*.18,s*.09,0,7); ctx.fill();
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-s*.15,-s*.17,s*.045,0,7); ctx.arc(s*.17,-s*.17,s*.045,0,7); ctx.fill();
  // munitions
  ctx.font=`900 ${Math.round(s*.4)}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=s*.1; ctx.strokeStyle='rgba(0,0,0,.65)'; ctx.strokeText(ammo,0,s*.15);
  ctx.fillStyle='#fff'; ctx.fillText(ammo,0,s*.15);
  ctx.restore();
}
function draw(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.clearRect(0,0,W,H);
  // tapis
  const bx=gx-OFF,by=gy-OFF,bw=G+2*OFF;
  ctx.lineWidth=BT+8; ctx.strokeStyle='#5b6372'; rr(bx,by,bw,bw,OFF); ctx.stroke();
  ctx.lineWidth=BT; ctx.strokeStyle='#cfd5df'; rr(bx,by,bw,bw,OFF); ctx.stroke();
  ctx.save(); ctx.setLineDash([3,11]); ctx.lineDashOffset=-beltT*SPEED; ctx.lineWidth=BT-10; ctx.strokeStyle='#b9c0cc'; rr(bx,by,bw,bw,OFF); ctx.stroke(); ctx.restore();
  // fond de l'image
  ctx.fillStyle='#24242c'; rr(gx-4,gy-4,G+8,G+8,6); ctx.fill();
  const photo=level<=PHOTOS.length, pad=photo?.4:Math.max(.6,cs*.08), rad=photo?cs*.2:cs*.28;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    let v=grid[r][c]; if(v===-1) continue; if(v<-1) v=-2-v;
    const x=gx+c*cs,y=gy+r*cs;
    ctx.fillStyle=colors[v]; rr(x+pad,y+pad,cs-2*pad,cs-2*pad,rad); ctx.fill();
    if(level>PHOTOS.length){ctx.fillStyle='rgba(255,255,255,.28)'; ctx.beginPath(); ctx.arc(x+cs*.36,y+cs*.34,cs*.14,0,7); ctx.fill();}
  }
  // balles
  for(const u of bullets){const f=u.t/u.dur;const x=u.x0+(u.x1-u.x0)*f,y=u.y0+(u.y1-u.y0)*f;ctx.fillStyle=colors[u.v];ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill();ctx.stroke();}
  // tireurs sur le tapis
  for(const b of belt){const p=posAt(b.s);drawShooter(p.x,p.y,SZ,b.color,b.ammo,1,b.bump);}
  // particules
  for(const p of particles){ctx.globalAlpha=Math.min(1,p.t*3);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);} ctx.globalAlpha=1;
  // compteur tapis
  const used=belt.length+pending.length;
  ctx.font='800 17px system-ui,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.lineWidth=4; ctx.strokeStyle='#1d2030'; ctx.strokeText(`Tapis ${used}/${BELT_MAX}`,14,412);
  ctx.fillStyle=flash>0?'#ff5a5a':'#fff'; ctx.fillText(`Tapis ${used}/${BELT_MAX}`,14,412);
  ctx.textAlign='right'; const pct=Math.round(100*(1-remaining/(N*N)));
  ctx.strokeText(pct+'%',386,412); ctx.fillStyle='#fff'; ctx.fillText(pct+'%',386,412);
  // zone d'attente
  for(let i=0;i<HOLD;i++){
    const x=24+i*72,y=428;
    ctx.fillStyle='#3a3f55'; rr(x,y,64,60,12); ctx.fill();
    ctx.strokeStyle='#4d536d'; ctx.lineWidth=2; ctx.stroke();
    if(hold[i]) drawShooter(x+32,y+31,48,hold[i].color,hold[i].ammo);
  }
  // colonnes
  for(let j=0;j<4;j++){
    const cx=62+j*92, col=columns[j];
    for(let k=Math.min(col.length,3)-1;k>=0;k--){
      const y=548+k*66; drawShooter(cx,y,k===0?60:50,col[k].color,col[k].ammo,k===0?1:.5);
    }
    if(col.length>3){ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillText('+'+(col.length-3),cx,730);}
  }
}

// ----- Entrées -----
cv.addEventListener('pointerdown',e=>{
  unlockAudio();
  const rc=cv.getBoundingClientRect(), x=(e.clientX-rc.left)/scale, y=(e.clientY-rc.top)/scale;
  for(let i=0;i<HOLD;i++){const hx=24+i*72; if(x>=hx&&x<=hx+64&&y>=428&&y<=488&&hold[i]){ if(launch(hold[i])) hold[i]=null; return; }}
  for(let j=0;j<4;j++){const cx=62+j*92; if(Math.abs(x-cx)<44&&y>=508&&y<=588&&columns[j].length){ if(launch(columns[j][0])) columns[j].shift(); return; }}
});
function showEnd(){
  const ov=document.getElementById('ov'); ov.style.display='flex';
  if(state==='win'){ document.getElementById('t').textContent='Bravo !'; document.getElementById('m').textContent=`Niveau ${level} terminé`; document.getElementById('btn').textContent='Niveau suivant'; }
  else { document.getElementById('t').textContent='Tapis bloqué !'; document.getElementById('m').textContent="Plus de place dans la zone d'attente."; document.getElementById('btn').textContent='Réessayer'; }
}
document.getElementById('btn').onclick=()=>start(state==='win'?level+1:level);
document.getElementById('rst').onclick=()=>start(level);
document.getElementById('snd').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊';};

// ----- Son -----
let ac=null,muted=false,lastS=0;
function unlockAudio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function sound(){ if(!ac||muted)return; const t=ac.currentTime; if(t-lastS<.035)return; lastS=t;
  try{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(520+Math.random()*260,t);o.frequency.exponentialRampToValueAtTime(220,t+.07);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.09);}catch(e){} }

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
resize(); start(level); requestAnimationFrame(loop);

</script>
</body>

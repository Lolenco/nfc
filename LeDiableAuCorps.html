<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Le Diable au Corps – Tatouage · Piercing</title>
<link rel="icon" href="LeDiableAuCorps-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --white:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--white);
  font-family:"Jost","Century Gothic","Futura",sans-serif;
  font-weight:300;
  overflow-x:hidden;
}
main{
  min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 24px;
  text-align:center;
}
.logo{
  width:clamp(150px,44vw,210px);height:auto;aspect-ratio:1;
  border-radius:50%;
  display:block;
}
h1{
  margin:30px 0 0;
  font-family:"Playfair Display","Didot","Bodoni MT",Georgia,serif;
  font-weight:800;
  font-size:clamp(34px,10.5vw,56px);
  letter-spacing:.01em;
  line-height:1.05;
}
.tag{
  margin:16px 0 0;
  font-size:clamp(13px,3.6vw,16px);
  letter-spacing:.3em;text-indent:.3em;
  text-transform:uppercase;
}
.place{
  margin:8px 0 0;
  font-size:14px;letter-spacing:.08em;
  opacity:.6;
}
.lead{
  margin:44px 0 22px;
  font-size:16px;
  opacity:.85;
}
.actions{
  display:flex;flex-direction:column;gap:14px;
  width:100%;max-width:320px;
}
.btn{
  display:block;
  padding:16px 24px;
  border-radius:999px;
  border:1px solid var(--white);
  color:var(--white);
  text-decoration:none;
  font:400 16px/1 "Jost",sans-serif;
  letter-spacing:.06em;
  transition:background .25s,color .25s,transform .25s;
}
.btn.primary{background:var(--white);color:var(--bg)}
.btn:hover{background:var(--white);color:var(--bg)}
.btn.primary:hover{background:transparent;color:var(--white)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--white);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
  <img class="logo" src="LeDiableAuCorps-logo.png" width="480" height="480" alt="Logo Le Diable au Corps">
  <h1>Le Diable<br>au Corps</h1>
  <p class="tag">Tatouage · Piercing</p>
  <p class="place">Boulogne-Billancourt</p>

  <p class="lead">Retrouvez-nous en ligne</p>
  <div class="actions">
    <a class="btn primary" href="https://www.instagram.com/le_diable_au_corps_tattoo/" target="_blank" rel="noopener">Suivre sur Instagram</a>
    <a class="btn" href="https://search.google.com/local/writereview?placeid=ChIJP-i73pl75kcR1zgXc6smb3c" target="_blank" rel="noopener">Laisser un avis Google</a>
  </div>
</main>
</body>
</html>
